# F901 — Default multi-layer feature workflow (map to @Architect execution plan)
name: feature-delivery
description: End-to-end feature across domain, application, infrastructure, UI, tests
strategy: sequential  # F1001 — parallel only inside parallel_group steps

steps:
  - id: 1
    agent: "@Backend-Dev"
    strategy: sequential
    parallel_group: null
    action: "Domain model and application contracts for the feature"
    depends_on: []
    acceptance:
      - "Handlers/DTOs compile"
      - "No layer violations per manifest architectureGuards"
    verify: "verifyCommands.build"

  - id: 2
    agent: "@DBA"
    strategy: sequential
    parallel_group: null
    action: "Schema/migrations if persistence changes required"
    depends_on: [1]
    optional: true
    acceptance:
      - "Migration applies cleanly or schema documented"

  - id: 3
    agent: "@Frontend-Dev"
    strategy: sequential
    parallel_group: null
    action: "UI consuming application contracts"
    depends_on: [1]
    acceptance:
      - "UI builds and uses DTOs from application layer only"

  - id: 4
    agent: "@Unit-Tester"
    strategy: sequential
    parallel_group: null
    action: "Unit tests for new behavior"
    depends_on: [1, 3]
    acceptance:
      - "verifyCommands.test passes"

  - id: 5
    agent: "@Security"
    strategy: parallel
    parallel_group: review
    action: "Security review if auth/secrets touched"
    depends_on: [1, 3]
    optional: true

  - id: 6
    agent: "@QA-Engine"
    strategy: sequential
    parallel_group: null
    action: "Integration/regression validation"
    depends_on: [4]

  - id: 7
    agent: "@Memory-Manager"
    strategy: sequential
    parallel_group: null
    action: "Record decisions, session log, CHANGELOG if user-facing"
    depends_on: [6]
